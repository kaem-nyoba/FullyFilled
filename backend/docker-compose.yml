name: fullyfilled

services:
  core-service:
    build: ./core-service
    restart: unless-stopped
    environment:
      PORT: 3000
      PB_URL: http://pocketbase:8090
    expose: ["3000"] # hanya untuk jaringan internal Docker
    mem_limit: 256m
    cpus: 0.5
    depends_on: [pocketbase]

  pocketbase:
    build: ./pocketbase
    restart: unless-stopped
    volumes:
      - pb-data:/pb/pb_data
    ports: ["127.0.0.1:8093:8090"]   # admin UI PocketBase
    mem_limit: 128m
    cpus: 0.25
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:80:80"]     # pintu yang dituju cloudflared di STB
    mem_limit: 64m
    cpus: 0.25
    depends_on: [core-service]

volumes:
  pb-data: