# Kunci rate limit: IP asli pengguna dari Cloudflare.
# Tanpa ini, semua request terlihat berasal dari satu alamat (cloudflared),
# sehingga SEMUA pengguna berbagi satu jatah dan saling memblokir.
map $http_cf_connecting_ip $kunci_klien {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $kunci_klien zone=api:10m rate=10r/s;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_requests;

        proxy_pass http://core-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location @too_many_requests {
        default_type application/json;
        return 429 '{"error":{"code":"TOO_MANY_REQUESTS","message":"Terlalu banyak permintaan, coba lagi sebentar."}}';
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Gunakan path /api/."}}';
    }
}